<!DOCTYPE hmtl>
<html lang="en">
    <head>
        <link charset="utf-8">
        <link name="viewport" content="width=device-width, initial-scale=1">
        <title>CSS Methods</title>
        <style> 
            div p {
                background-color: red;
                color: white;
                text-align: center;
                font-size: 32px;
                font-weight: bold;
            }

            p {
                background-color: green;
                color: white;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <div>
            <p>Style me via the internal method!</p>
        </div>
        <p>I would like to be styled with the internal method, please.</p>
        <button style="background-color: rgb(255, 136, 0); font-size: 18px;">Inline Method</button>
    </body>
</html>
